tushare:
  token: "YOUR_TUSHARE_TOKEN_HERE"
  base_url: "http://api.tushare.pro"
  rate_limit_ms: 350
  daily_call_limit: 5000

data:
  raw_dir: "./data/raw"
  meta_dir: "./data/meta"
  db_path: "./data/meta/quant.db"

fetch:
  start_year: 2021
  end_year: 2026
  stock_prefixes: ["60", "00", "001"]
  min_market_cap: 0

backtest:
  initial_capital: 100000.0
  commission: 0.0003
  slippage: 0.0001
  risk_free_rate: 0.03
  lot_size: 100

signal:
  default_strategies:
    - ma_crossover
    - macd
    - rsi
    - bollinger
    - volume_breakout
    - bull_flag
    - kdj
    - williams_r
    - donchian
    - mfi
    - sar
    - roc
    - ma_sticky
    - limit_up
    - relative_strength
    - atr_breakout
    - trend_pullback
  top_n: 20

# 正式买入候选需要有历史样本外证据。先运行
# ./go-quant validate build
# 生成 data/raw/validation/evidence.json。
validation:
  enabled: true
  path: "validation/evidence.json"
  min_samples: 30
  min_positive_folds: 2
  min_expected_return_pct: 0
  prior_samples: 20

ai:
  enabled: false
  base_url: "https://api.deepseek.com"
  api_key: ""                 # 推荐留空，使用 QUANT_AI_API_KEY
  api_key_env: "QUANT_AI_API_KEY"
  model: "deepseek-chat"
  timeout_sec: 60

backup:
  dir: ""                     # 默认 data.meta_dir/backups
  retention: 14
