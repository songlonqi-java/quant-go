tushare:
  token: "YOUR_TUSHARE_TOKEN_HERE"
  base_url: "http://api.tushare.pro"
  rate_limit_ms: 350
  daily_call_limit: 5000

data:
  raw_dir: "./data/raw"
  meta_dir: "./data/meta"
  db_path: "./data/meta/quant.db"

fetch:
  start_year: 2021
  end_year: 2026
  stock_prefixes: ["60", "00", "001"]
  min_market_cap: 0

backtest:
  initial_capital: 100000.0
  commission: 0.0003
  slippage: 0.0001
  risk_free_rate: 0.03
  lot_size: 100

# 买入资格与冲击成本。daily.amount 的原始单位由程序统一换算为人民币；
# 换手率需要先拉取 daily-basic，缺失时默认只提示、不阻断。
liquidity:
  enabled: true
  min_listing_days: 60
  amount_lookback: 20
  min_average_amount_cny: 20000000
  min_turnover_rate_pct: 0.5
  require_turnover_data: false
  max_participation_pct: 5
  impact_coefficient: 0.005
  max_impact_rate: 0.02

signal:
  default_strategies:
    - ma_crossover
    - macd
    - rsi
    - bollinger
    - volume_breakout
    - kdj
    - sar
    - relative_strength
    - atr_breakout
    - trend_pullback
  top_n: 20

# 组合级风险预算。reference_equity 是账户总权益（现金+持仓），用于把
# portfolio.yaml 中已有持仓折算成仓位；实盘资金变化后应同步调整。
portfolio:
  reference_equity: 100000.0
  max_total_position_pct: 70
  max_single_position_pct: 15
  max_sector_position_pct: 25

# 正式买入候选需要有历史样本外证据。先运行
# ./go-quant validate build
# 生成 data/raw/validation/evidence.json。min_samples 指独立信号日期簇数，
# 同日多只股票不会重复增加该数字。
validation:
  enabled: true
  path: "validation/evidence.json"
  min_samples: 30
  min_positive_folds: 2
  min_expected_return_pct: 0
  prior_samples: 20          # 同周期宽泛先验的最大等效样本权重

ai:
  enabled: false
  base_url: "https://api.deepseek.com"
  api_key: ""                 # 推荐留空，使用 QUANT_AI_API_KEY
  api_key_env: "QUANT_AI_API_KEY"
  model: "deepseek-chat"
  timeout_sec: 60

backup:
  dir: ""                     # 默认 data.meta_dir/backups
  retention: 14
