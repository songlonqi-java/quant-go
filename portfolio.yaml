# 我的交易流水 - 每次买卖记录在此，持仓和盈亏自动推算
#
# 格式:
#   date   : 交易日期 YYYYMMDD
#   code   : 股票代码 如 600489.SH
#   action : buy 买入 / sell 卖出
#   shares : 股数
#   price  : 成交价
#   comment: 备注 (可选)
#
# 示例:
#   - date: "20240315"
#     code: "600489.SH"
#     action: buy
#     shares: 100
#     price: 22.501
#     comment: "黄金板块启动"
#   - date: "20260710"
#     code: "600489.SH"
#     action: sell
#     shares: 100
#     price: 280.00
#     comment: "止盈"

transactions:
  - date: "20240315"
    code: "600489.SH"
    action: buy
    shares: 100
    price: 22.501
